name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    # .python-version に requires-python の下限を指定してあるため、下限の版で検査される
    lint-and-test:
        uses: sakashita44/.github/.github/workflows/reusable-python-ci.yml@main

    # 下限の版に加えて、最新の安定版でも型検査とテストを通す
    test-latest-python:
        runs-on: ubuntu-latest
        env:
            UV_PYTHON: '3.15'
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup uv
              # v8 以降はメジャー版のタグがないため、リリースの版を指定する
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --dev

            - name: Run pyright
              run: uv run pyright

            - name: Run tests
              run: |
                  if [ -d tests ]; then
                    uv run pytest
                  fi
